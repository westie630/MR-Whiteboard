<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
<defs>
<clipPath id="round"><rect width="512" height="512" rx="102"/></clipPath>

    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f2d4d"/>
      <stop offset="1" stop-color="#0e1628"/>
    </linearGradient>
  
</defs>
<g clip-path="url(#round)">
  <rect width="512" height="512" fill="url(#tile)"/>
</g>

  <!-- canvas frame: four corner brackets, the way AR marks out a surface -->
  <g fill="none" stroke="#2dd4bf" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
    <path d="M104 168 V134 Q104 104 134 104 H168"/>
    <path d="M344 104 H378 Q408 104 408 134 V168"/>
    <path d="M408 344 V378 Q408 408 378 408 H344"/>
    <path d="M168 408 H134 Q104 408 104 378 V344"/>
  </g>
  <!-- M, written as one pen stroke -->
  <path d="M164 340 V172 L256 286 L348 172 V340" fill="none" stroke="#f8fafc" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>

</svg>
